<div class="iv-stack iv-u-gap-5" style="max-width: 28rem">
  <div class="iv-meter-field">
    <label for="me-disk">Disk used</label>
    <span class="iv-meter-field__value">42 of 100 GB</span>
    <meter class="iv-meter" id="me-disk" min="0" max="100" low="70" high="90" optimum="20" value="42">42 GB</meter>
  </div>

  <div class="iv-meter-field">
    <label for="me-quota">Build minutes this month</label>
    <span class="iv-meter-field__value">780 of 1,000</span>
    <meter class="iv-meter" id="me-quota" min="0" max="1000" low="700" high="900" optimum="100" value="780">780 minutes</meter>
  </div>

  <div class="iv-meter-field">
    <label for="me-mem">Memory</label>
    <span class="iv-meter-field__value">95 %</span>
    <meter class="iv-meter iv-meter--lg" id="me-mem" min="0" max="100" low="70" high="90" optimum="20" value="95">95 %</meter>
  </div>

  <p class="iv-u-m-0 iv-u-text-sm iv-u-text-muted">Sample readings. The colour comes from the browser's own judgement of <code>low</code>, <code>high</code> and <code>optimum</code>; the value is always written next to the bar.</p>
</div>
