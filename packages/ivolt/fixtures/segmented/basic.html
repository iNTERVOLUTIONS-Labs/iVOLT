<div class="iv-stack iv-u-gap-5">
  <fieldset class="iv-segmented">
    <legend class="iv-u-sr-only">Period</legend>
    <label class="iv-segmented__item"><input type="radio" name="seg-period" value="day"><span>Day</span></label>
    <label class="iv-segmented__item"><input type="radio" name="seg-period" value="week" checked><span>Week</span></label>
    <label class="iv-segmented__item"><input type="radio" name="seg-period" value="month"><span>Month</span></label>
    <label class="iv-segmented__item"><input type="radio" name="seg-period" value="year"><span>Year</span></label>
  </fieldset>

  <fieldset class="iv-segmented iv-segmented--brand">
    <legend class="iv-u-sr-only">Billing</legend>
    <label class="iv-segmented__item"><input type="radio" name="seg-billing" value="monthly"><span>Monthly</span></label>
    <label class="iv-segmented__item"><input type="radio" name="seg-billing" value="yearly" checked><span>Yearly <span class="iv-badge iv-badge--success">−20 %</span></span></label>
  </fieldset>

  <fieldset class="iv-segmented iv-segmented--block iv-segmented--sm" style="max-width: 24rem">
    <legend class="iv-u-sr-only">View</legend>
    <label class="iv-segmented__item"><input type="radio" name="seg-view" value="list" checked><span>List</span></label>
    <label class="iv-segmented__item"><input type="radio" name="seg-view" value="board"><span>Board</span></label>
    <label class="iv-segmented__item"><input type="radio" name="seg-view" value="calendar" disabled><span>Calendar</span></label>
  </fieldset>

  <p class="iv-u-m-0 iv-u-text-sm iv-u-text-muted">Native radio groups: Tab reaches the group once, the arrow keys move the choice. Nothing on this page reacts to it.</p>
</div>
