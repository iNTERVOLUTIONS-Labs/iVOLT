<div class="iv-stack iv-u-gap-6">
  <fieldset class="iv-rating">
    <legend class="iv-rating__legend">How useful was this page?</legend>
    <input class="iv-rating__input" type="radio" id="rt-1" name="rt" value="1">
    <label class="iv-rating__star" for="rt-1"><span class="iv-u-sr-only">1 star</span></label>
    <input class="iv-rating__input" type="radio" id="rt-2" name="rt" value="2">
    <label class="iv-rating__star" for="rt-2"><span class="iv-u-sr-only">2 stars</span></label>
    <input class="iv-rating__input" type="radio" id="rt-3" name="rt" value="3">
    <label class="iv-rating__star" for="rt-3"><span class="iv-u-sr-only">3 stars</span></label>
    <input class="iv-rating__input" type="radio" id="rt-4" name="rt" value="4" checked>
    <label class="iv-rating__star" for="rt-4"><span class="iv-u-sr-only">4 stars</span></label>
    <input class="iv-rating__input" type="radio" id="rt-5" name="rt" value="5">
    <label class="iv-rating__star" for="rt-5"><span class="iv-u-sr-only">5 stars</span></label>
  </fieldset>

  <div class="iv-stack iv-u-gap-2">
    <div class="iv-cluster iv-u-items-center iv-u-gap-2">
      <span class="iv-rating-display" role="img" aria-label="4.6 out of 5" style="--iv-rating-value: 4.6"></span>
      <span class="iv-u-text-sm"><strong>4.6</strong> <span class="iv-u-text-muted">· 128 reviews (sample)</span></span>
    </div>
    <div class="iv-cluster iv-u-items-center iv-u-gap-2">
      <span class="iv-rating-display iv-rating--sm" role="img" aria-label="3 out of 5" style="--iv-rating-value: 3"></span>
      <span class="iv-u-text-sm iv-u-text-muted">Small display, 3 of 5</span>
    </div>
  </div>

  <p class="iv-u-m-0 iv-u-text-sm iv-u-text-muted">Demo: the rating is a radio group in a form that sends nothing. Tab reaches it once; the arrow keys change the score.</p>
</div>
