<div class="iv-stack iv-u-gap-2 iv-u-max-w-measure">
  <p class="iv-u-m-0">A plain rule between two blocks fades in and out at both ends.</p>
  <hr class="iv-divider">
  <p class="iv-u-m-0">A labelled rule separates two ways of doing the same thing.</p>

  <div class="iv-stack iv-u-gap-3">
    <button class="iv-button iv-button--secondary iv-u-w-full" type="button">Continue with a passkey</button>
    <div class="iv-divider" role="separator" aria-label="or"><span class="iv-divider__label" aria-hidden="true">or</span></div>
    <button class="iv-button iv-button--primary iv-u-w-full" type="button">Continue with email</button>
  </div>

  <div class="iv-divider iv-divider--start iv-divider--brand" role="separator" aria-label="Release notes"><span class="iv-divider__label" aria-hidden="true">Release notes</span></div>
  <p class="iv-u-m-0">The brand variant draws the line with the primary; <code>--start</code> and <code>--end</code> move the label to one side.</p>

  <div class="iv-cluster iv-u-items-stretch iv-u-gap-0" style="block-size: 2.5rem">
    <button class="iv-button iv-button--ghost iv-button--sm" type="button">Bold</button>
    <button class="iv-button iv-button--ghost iv-button--sm" type="button">Italic</button>
    <hr class="iv-divider iv-divider--vertical" aria-orientation="vertical">
    <button class="iv-button iv-button--ghost iv-button--sm" type="button">Link</button>
  </div>
  <p class="iv-u-m-0 iv-u-text-sm iv-u-text-muted">Sample buttons: none of them does anything.</p>
</div>
