<div class="iv-stack iv-u-gap-5">
  <fieldset class="iv-stack iv-u-gap-3" style="border: 0; padding: 0; margin: 0">
    <legend class="iv-u-text-sm iv-u-font-medium iv-u-mb-2">Filter by stack</legend>
    <div class="iv-cluster iv-u-gap-2">
      <label class="iv-chip"><input type="checkbox" name="chip-stack" value="html" checked><span>HTML</span></label>
      <label class="iv-chip"><input type="checkbox" name="chip-stack" value="css" checked><span>CSS</span></label>
      <label class="iv-chip"><input type="checkbox" name="chip-stack" value="astro"><span>Astro</span></label>
      <label class="iv-chip"><input type="checkbox" name="chip-stack" value="wordpress"><span>WordPress</span></label>
      <label class="iv-chip"><input type="checkbox" name="chip-stack" value="legacy" disabled><span>Legacy</span></label>
    </div>
  </fieldset>

  <div class="iv-cluster iv-u-gap-2" aria-label="Selected cities (sample)">
    <span class="iv-chip">Madrid <button class="iv-chip__remove" type="button" aria-label="Remove Madrid"></button></span>
    <span class="iv-chip">Lisbon <button class="iv-chip__remove" type="button" aria-label="Remove Lisbon"></button></span>
    <span class="iv-chip iv-chip--sm">Porto <button class="iv-chip__remove" type="button" aria-label="Remove Porto"></button></span>
  </div>

  <div class="iv-cluster iv-u-gap-2">
    <span class="iv-chip"><span class="iv-chip__media"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" fill="#1D4FC4"/><path d="M7 16l5-9 5 9z" fill="#fff"/></svg></span>Design system</span>
    <span class="iv-chip">Plain tag</span>
  </div>

  <p class="iv-u-m-0 iv-u-text-sm iv-u-text-muted">Sample values: the filters filter nothing and the remove buttons remove nothing on this page.</p>
</div>
