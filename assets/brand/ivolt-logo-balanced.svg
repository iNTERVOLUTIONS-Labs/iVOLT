  <title id="ivolt-title">iVOLT CSS — by iNTERVOLUTIONS</title>
  <desc id="ivolt-desc">Electric green lightning in an open hexagonal frame beside an ivory geometric iVOLT wordmark. Transparent background. Designed for dark surfaces.</desc>

  <!-- Open hexagonal frame: a compact mark that also works on its own. -->
  <!-- Both halves move outward; the full-height lightning aligns with the frame. -->
  <!-- Four parallel frame cuts maintain equal perpendicular clearance around the lightning. -->
  <g fill="#29F59A">
    <path d="M83 64H154.104916L140.872773 90H94L63 121V199L94 230H125.897317L120.047317 256H83L35 208V112Z"/>
    <path d="M218 64H235L283 112V208L235 256H141.696291L159.156750 230H224L255 199V121L224 90H204.159483Z"/>
    <path d="M165 64H207L169 135.384615H211L130 256L148 176H108Z"/>
  </g>
  <!-- Custom outlined wordmark. No font or other external dependency. -->
  <g fill="#F3FAF6">
    <path d="M332 127H361V211H332Z"/>
    <path d="M384 88H417L453 172L489 88H522L468 211H438Z"/>
    <path fill-rule="evenodd" d="M562 88H637L661 112V187L637 211H562L538 187V112ZM575 116L568 123V176L575 183H624L631 176V123L624 116Z"/>
    <path d="M686 88H716V183H789V211H686Z"/>
    <path d="M791 88H926V116H874V211H844V116H791Z"/>
  </g>
  <path fill="#29F59A" d="M332 88H361V112H332Z"/>
