<section class="iv-hero iv-hero--split" id="block-hero-split">
  <div class="iv-hero__media" aria-hidden="true" style="background-image: radial-gradient(70% 80% at 85% 10%, color-mix(in oklab, var(--iv-color-accent) 45%, var(--iv-palette-neutral-1000)), transparent 65%), radial-gradient(60% 70% at 0% 100%, color-mix(in oklab, var(--iv-color-primary) 45%, var(--iv-palette-neutral-1000)), transparent 60%), linear-gradient(200deg, var(--iv-palette-neutral-900), var(--iv-palette-neutral-1000))"></div>
  <div class="iv-hero__content">
    <p class="iv-hero__kicker">Sample block · invented data</p>
    <h1 class="iv-hero__title">Numbers your team can read</h1>
    <p class="iv-hero__lead">A two-column opening: the message on one side, proof on the other. Below the medium breakpoint the panel follows the text.</p>
    <div class="iv-hero__actions">
      <a class="iv-button iv-button--primary iv-button--lg" href="#block-hero-split">Book a demo</a>
    </div>
  </div>
  <aside class="iv-hero__aside">
    <div class="iv-stat-group">
      <div class="iv-stat iv-stat--card iv-stat--glow">
        <span class="iv-stat__label">Weekly revenue (sample)</span>
        <strong class="iv-stat__value">48,210 €</strong>
        <span class="iv-stat__delta" data-iv-tone="up">+12 %<span class="iv-u-sr-only"> compared with last week</span></span>
      </div>
      <div class="iv-stat iv-stat--card">
        <span class="iv-stat__label">Active accounts (sample)</span>
        <strong class="iv-stat__value">1,284</strong>
        <span class="iv-stat__delta" data-iv-tone="flat">no change</span>
      </div>
    </div>
  </aside>
</section>
