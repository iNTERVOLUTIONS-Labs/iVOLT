<section class="iv-container iv-container--narrow iv-u-py-10" aria-labelledby="auth-title">
  <div class="iv-card"><div class="iv-card__body iv-stack iv-u-gap-5 iv-u-p-8">
    <div class="iv-stack iv-u-gap-2">
      <h2 class="iv-u-m-0" id="auth-title">Sign in</h2>
      <p class="iv-u-m-0 iv-u-text-sm iv-u-text-muted">Demo form: nothing is submitted.</p>
    </div>
    <form class="iv-stack iv-u-gap-4" action="#auth-title" method="get">
      <div class="iv-field">
        <label class="iv-label" for="auth-email">Email</label>
        <input class="iv-input" id="auth-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="iv-field">
        <label class="iv-label" for="auth-pass">Password</label>
        <input class="iv-input" id="auth-pass" name="password" type="password" autocomplete="current-password" required>
      </div>
      <label class="iv-check"><input type="checkbox" name="remember"> Keep me signed in</label>
      <button class="iv-button iv-button--primary iv-u-w-full" type="submit">Sign in</button>
    </form>
    <p class="iv-u-m-0 iv-u-text-sm iv-u-text-center iv-u-text-muted">No account? <a href="#auth-title">Create one</a></p>
  </div></div>
</section>
