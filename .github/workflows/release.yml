# Publishes @intervolutions/ivolt to npm with a provenance statement when a GitHub release is
# published. Authentication is npm trusted publishing (OIDC): npmjs.com trusts this workflow file
# in this repository, so no long-lived token is stored anywhere; see docs/RELEASE.md §5. If the
# repository secret NPM_TOKEN exists it is the fallback while the trusted publisher is not set up.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance: the job proves which workflow and commit built the tarball

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install
        run: npm ci --no-audit --no-fund

      # The tag of the release must be the version in the package (v1.1.2 ↔ 1.1.2), and the
      # version must be the one the code reports, so a release can never publish other code.
      - name: Check the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg="$(node -p "require('./packages/ivolt/package.json').version")"
          if [ "$TAG" != "v$pkg" ]; then
            echo "::error title=Version mismatch::Release tag $TAG does not match packages/ivolt/package.json version $pkg."
            exit 1
          fi
          if ! grep -q "export const version = \"$pkg\";" packages/ivolt/src/js/index.js; then
            echo "::error title=Version mismatch::src/js/index.js does not export version $pkg."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Unit and contract tests
        run: npm test

      - name: Sizes against budgets
        run: npm run sizes

      # pack-smoke drives the plain-HTML starter in Chromium, and the starter gets its copy of
      # dist/ from sync-examples.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Pack and install in an external consumer
        run: |
          node scripts/sync-examples.mjs
          npm run pack-smoke

      # A prerelease on GitHub goes to the `next` tag, a release to `latest`. npm tries the OIDC
      # exchange first and only uses the token when no trusted publisher answers.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --provenance --access public --tag "$DIST_TAG" -w @intervolutions/ivolt
