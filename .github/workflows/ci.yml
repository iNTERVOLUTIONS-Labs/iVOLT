# Public CI: the package gate on every push and pull request to main.
# The release gate (`npm run verify` with IVOLT_ALL_BROWSERS=1, three engines) still runs before each
# publication, see docs/RELEASE.md; this workflow is the part that anybody can watch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package, fixtures and site (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Unit and contract tests
        run: npm test

      - name: Sizes against budgets
        run: npm run sizes

      # Browsers are cached by Playwright version; the system libraries are installed every time
      # because they live outside the cache. pack-smoke already needs Chromium (it drives the
      # plain-HTML starter), so this comes before it.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The starter that pack-smoke serves gets its copy of dist/ from this script.
      - name: Copy the build into the examples
        run: node scripts/sync-examples.mjs

      - name: Pack and install in an external consumer
        run: npm run pack-smoke

      # Fixture specs: every spec that does not talk to the docs site on port 4321. Screenshot
      # baselines are made on the release machine and its fonts; a hosted runner renders text a few
      # pixels differently, so pixel comparisons are skipped here and every other assertion of
      # visual.spec.js still runs.
      - name: Browser tests on the fixtures (Chromium)
        env:
          IVOLT_SKIP_DOCS_SERVER: "1"
        run: npx playwright test --project=chromium --ignore-snapshots $(grep -L "4321" tests/browser/*.spec.js)

      - name: Build the documentation site
        run: npm run build:docs

      # Site specs: the ones that open the docs site. The site was built in the previous step, so the
      # docs server only serves it.
      - name: Browser tests on the documentation site (Chromium)
        env:
          DOCS_SKIP_BUILD: "1"
        run: npx playwright test --project=chromium --ignore-snapshots $(grep -l "4321" tests/browser/*.spec.js)

      - name: Upload the Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
